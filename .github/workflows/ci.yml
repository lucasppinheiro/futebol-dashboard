name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt --group dev
          npm ci
      - run: ruff check .
      - run: ruff format --check .
      - run: npm run lint
      - run: npm run format:check

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt --group dev
      - name: Run tests with coverage (informativo, sem gate)
        run: python -m pytest tests --cov --cov-report=term-missing

  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Cobertura informativa: os testes executam static/js via eval no jsdom,
      # entao o Istanbul nao instrumenta esses arquivos (aparecem com 0%).
      - run: npx jest --coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Build static smoke
        env:
          DATA_AUTO_REFRESH_HOURS: "0"
          SITE_BASE_PATH: ""
        run: |
          python build_static.py
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/api/classificacao.json
          test -s dist/sitemap.xml
