name: Refresh Data And Publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data-and-publish-pages
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.publish_state.outputs.should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh local dataset
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          DATA_AUTO_REFRESH_HOURS: "0"
        run: python atualizar_dados.py

      - name: Commit updated dataset
        id: commit_data
        shell: bash
        run: |
          if git diff --quiet -- data/brasileirao.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brasileirao.json
          git commit -m "chore: refresh competition data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: publish_state
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.commit_data.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$DATA_CHANGED" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.publish_state.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Build static output
        if: steps.publish_state.outputs.should_deploy == 'true'
        env:
          DATA_AUTO_REFRESH_HOURS: "0"
          SITE_BASE_PATH: "/${{ github.event.repository.name }}"
        run: python build_static.py

      - name: Upload GitHub Pages artifact
        if: steps.publish_state.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: needs.refresh-and-build.outputs.should_deploy == 'true'
    needs: refresh-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
