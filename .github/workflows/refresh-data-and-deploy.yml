name: Refresh Data And Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-data-and-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh local dataset
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          DATA_AUTO_REFRESH_HOURS: "0"
        run: python atualizar_dados.py

      - name: Commit updated dataset
        id: commit_data
        shell: bash
        run: |
          if git diff --quiet -- data/brasileirao.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Lucas Gabriel"
          git config user.email "lucas.gabrielpnr@gmail.com"
          git add data/brasileirao.json
          git commit -m "chore: refresh competition data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build static output
        if: steps.commit_data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATA_AUTO_REFRESH_HOURS: "0"
        run: python build_static.py

      - name: Deploy to Netlify
        if: steps.commit_data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify deploy --prod --dir dist --no-build --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Automated data refresh"
