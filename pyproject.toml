[project]
name = "futebol-dashboard"
version = "1.0.0"
description = "Dashboard do Brasileirão Série A com Flask, geração estática e deploy na Vercel"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["flask>=3.0,<4"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=6",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", "dist/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tabelas de dados seed e dicts tabulares mantem layout largo de proposito
"gerar_dados.py" = ["E501"]
"api_client.py" = ["E501"]

[tool.ruff.format]
exclude = ["gerar_dados.py"]
